[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "centromere-pipeline"
version = "0.1.0"
description = "High-performance modular Python pipeline for identification, density-scoring, clustering, and classification of centromeric satellite arrays."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Bioinformatics Team" }
]
dependencies = [
    "numpy>=1.24",
    "polars>=1.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
centromere-pipeline = "centromere_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["centromere_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
